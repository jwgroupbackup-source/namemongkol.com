<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-labelledby="title desc">
  <title id="title">หลักการตั้งชื่อลูกชายเกิดวันพุธกลางคืน</title>
  <desc id="desc">Mind map หลักการตั้งชื่อลูกชายเกิดวันพุธกลางคืน ได้แก่ ทักษา เลขศาสตร์ อายตนะ ความหมาย และนามสกุล</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="52%" stop-color="#071a3a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8dfa4"/>
      <stop offset="52%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="soft">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="676" fill="url(#glow)"/>
  <g opacity=".35" fill="#fbbf24">
    <circle cx="84" cy="84" r="3"/><circle cx="188" cy="148" r="2"/><circle cx="1010" cy="102" r="3"/><circle cx="1094" cy="258" r="2"/><circle cx="130" cy="558" r="3"/><circle cx="980" cy="532" r="2"/>
  </g>
  <text x="600" y="82" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="42" font-weight="800" fill="#fff">หลักการตั้งชื่อลูกชายเกิดวันพุธกลางคืน</text>
  <text x="600" y="122" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" fill="#fde68a">ตรวจครบ 5 ชั้น ก่อนเลือกชื่อจริงให้ลูก</text>
  <g stroke="url(#gold)" stroke-width="5" opacity=".7">
    <line x1="600" y1="330" x2="238" y2="230"/><line x1="600" y1="330" x2="962" y2="230"/>
    <line x1="600" y1="330" x2="274" y2="472"/><line x1="600" y1="330" x2="926" y2="472"/>
    <line x1="600" y1="330" x2="600" y2="548"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="600" cy="330" r="116" fill="#06152f" stroke="url(#gold)" stroke-width="5"/>
    <text x="600" y="312" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="30" font-weight="800" fill="#fde68a">ชื่อมงคล</text>
    <text x="600" y="352" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="25" fill="#fff">วันพุธกลางคืน</text>
    <text x="600" y="390" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="20" fill="#cbd5e1">18.00 - 05.59 น.</text>
  </g>
  <g font-family="Tahoma, sans-serif" filter="url(#soft)">
    <g transform="translate(108 172)"><rect width="260" height="116" rx="28" fill="#10284f" stroke="#fbbf24"/><text x="130" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">ทักษา</text><text x="130" y="82" text-anchor="middle" font-size="20" fill="#fde68a">เลี่ยง บ ป ผ ฝ พ ฟ ภ ม</text></g>
    <g transform="translate(832 172)"><rect width="260" height="116" rx="28" fill="#10284f" stroke="#fbbf24"/><text x="130" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">เลขศาสตร์</text><text x="130" y="82" text-anchor="middle" font-size="20" fill="#fde68a">ผลรวมและคู่เลข</text></g>
    <g transform="translate(144 426)"><rect width="260" height="116" rx="28" fill="#10284f" stroke="#fbbf24"/><text x="130" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">อายตนะ</text><text x="130" y="82" text-anchor="middle" font-size="20" fill="#fde68a">แรงส่งด้านจิตใจ</text></g>
    <g transform="translate(796 426)"><rect width="260" height="116" rx="28" fill="#10284f" stroke="#fbbf24"/><text x="130" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">ความหมาย</text><text x="130" y="82" text-anchor="middle" font-size="20" fill="#fde68a">ไพเราะและเจตนาดี</text></g>
    <g transform="translate(470 532)"><rect width="260" height="96" rx="28" fill="#10284f" stroke="#fbbf24"/><text x="130" y="42" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">นามสกุล</text><text x="130" y="72" text-anchor="middle" font-size="19" fill="#fde68a">ตรวจคะแนนรวม</text></g>
  </g>
</svg>
